[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantport"
version = "0.2.0"
description = "QuantPort: agent skills that port a quantization method onto a model on a GPU and measure it against fp16."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.25",
    "pypdf>=4.0",
    "pyyaml>=6",
    "requests>=2.31",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
